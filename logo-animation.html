<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#05070a"><title>ALAM VFX STUDIO — Logo Reveal</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:#05070a;color:#eef8fb;font-family:Arial,sans-serif}.backdrop{position:fixed;inset:0;background:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:70px 70px;mask-image:radial-gradient(ellipse at center,#000,transparent 78%)}.glow{position:fixed;width:min(70vw,800px);aspect-ratio:1;border-radius:50%;background:#00bfe9;filter:blur(150px);opacity:.09;animation:pulse 4s ease-in-out infinite}.stage{position:relative;width:min(94vw,1200px);text-align:center}.logo{display:block;width:100%;height:auto;opacity:0;transform:scale(.94) translateY(15px);animation:reveal 2.2s cubic-bezier(.16,1,.3,1) .25s forwards;filter:drop-shadow(0 0 30px rgba(0,195,255,.2))}.tag{margin-top:24px;font-size:clamp(9px,1.3vw,13px);letter-spacing:.42em;color:#b9c8ce;opacity:0;animation:fade .8s ease 1.6s forwards}.replay{position:fixed;bottom:25px;right:25px;border:1px solid #167e99;background:#071117;color:#eafaff;padding:12px 17px;letter-spacing:.13em;font-size:10px;cursor:pointer}.back{position:fixed;top:25px;left:25px;color:#b6c7ce;text-decoration:none;font-size:10px;letter-spacing:.15em}@keyframes reveal{0%{opacity:0;transform:scale(.94) translateY(15px);filter:brightness(.45) drop-shadow(0 0 0 rgba(0,195,255,0))}55%{opacity:1;filter:brightness(1.25) drop-shadow(0 0 34px rgba(0,195,255,.45))}100%{opacity:1;transform:scale(1) translateY(0);filter:brightness(1) drop-shadow(0 0 14px rgba(0,195,255,.16)}}@keyframes fade{to{opacity:1}}@keyframes pulse{50%{opacity:.16;transform:scale(1.12)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style></head><body><div class="backdrop"></div><div class="glow"></div><a class="back" href="index.html">← BACK TO WEBSITE</a><main class="stage" id="stage"><img class="logo" id="logo" src="assets/alam-vfx-studio-logo.png" alt="ALAM VFX STUDIO logo"><div class="tag">CREATIVE PRODUCTION SERVICES</div></main><button class="replay" onclick="replayAnimation()">↻ REPLAY REVEAL</button><script>function replayAnimation(){const stage=document.getElementById('stage');const clone=stage.cloneNode(true);stage.replaceWith(clone);clone.id='stage';}</script></body></html>
